<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mi Diseño Industrial - A-Frame</title>
    <!-- Librería A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
  </head>
  <body>
    <a-scene>
      
      <!-- Precarga del modelo CAD leyendo desde la carpeta models -->
      <a-assets>
        <a-asset-item id="brazoRobotico" src="models/BrazoOptimizado.glb"></a-asset-item>
      </a-assets>

      <!-- Espacio de trabajo-->
      <a-entity position="0 0 -5">
        <a-plane rotation="-90 0 0" width="40" height="40" color="gray"></a-plane>
        <a-plane position="0 10 0" rotation="90 0 0" width="30" height="30" color="#8CD9F2"></a-plane>

        <a-entity geometry="primitive: cylinder; radius: 3; height: 5; openEnded: true" 
                  material="color: black; side: double; transparent: true; opacity: 0.5" 
                  position="-6 2.5 0">
                <!-- CILINDRO AGUA -->
                <a-cylinder position="0 -0.2 0" radius="2.99" height="5" color="blue"></a-cylinder>     
                <a-cylinder position="4.3 0.4 0" rotation="90 0 90" radius="0.2" height="2.9" color="gray"></a-cylinder>     
        </a-entity>

        <!-- CILINDRO CONTENEDOR -->
        <a-entity geometry="primitive: cylinder; radius: 1; height: 3; openEnded: true" 
                  material="color: #FFC65D; side: double; transparent: true; opacity: 0.5" 
                  position="0 0.75 0">

                <!-- CILINDRO AGUA -->
                <a-cylinder position="0 -0.35 0" radius="0.99" height="2" color="blue"></a-cylinder>    
                <!-- SENSORES -->
                <a-sphere position="1.1 1.1 0" radius="0.1" color="red"></a-sphere>
                <a-sphere position="1.1 0.4 0" radius="0.1" color="green"></a-sphere>
                <a-sphere position="1.1 -0.30 0" radius="0.1" color="green"></a-sphere>
        </a-entity>

        <!-- Controles -->
        <a-box position="0 0 4" width="2" height="1" color="brown">
            <a-sphere position="-0.5 0.5 0" radius="0.2" color="green"></a-sphere>
            <a-sphere position="0.5 0.5 0" radius="0.2" color="red"></a-sphere>
        </a-box>

        <a-entity geometry="primitive: cylinder; radius: 3; height: 10; openEnded: true" 
                  material="color: black; side: double; transparent: true; opacity: 0.5" 
                  position="-6 2.5 -10">
                <!-- CILINDRO AGUA -->
                <a-cylinder position="0 -0.2 0" radius="2.99" height="10" color="blue"></a-cylinder>     
                <a-cylinder position="0 4 5.2" rotation="90 0 0" radius="0.2" height="5" color="gray"></a-cylinder>     
        </a-entity>

        <!-- Instanciación del brazo robótico en metros (cerca del centro) -->
        <a-entity gltf-model="#brazoRobotico" position="0 0 0" scale="50 50 50" rotation="0 0 0"></a-entity>
      </a-entity>

      <!-- Cielo de la escena -->
      <a-sky color="white"></a-sky>
    </a-scene>
  </body>
</html>
